org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
# Loom 1.7 is compiled for Java 21; keep the Gradle daemon on that JDK even
# when VS Code or the shell has a newer Java runtime selected.
org.gradle.java.home=D:/Java/jdk-21
# Make the Java 21 toolchain discoverable when Gradle is launched by VS Code
# with a different JVM (the project targets Minecraft 1.21.1).
org.gradle.java.installations.paths=D:/Java/jdk-21
