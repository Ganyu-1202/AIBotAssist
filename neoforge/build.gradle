plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); neoForge() }
configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}
dependencies {
    neoForge 'net.neoforged:neoforge:21.1.172'
    modImplementation 'dev.architectury:architectury-neoforge:13.0.8'
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}
shadowJar { configurations = [project.configurations.shadowCommon]; archiveClassifier = 'dev-shadow' }
remapJar { inputFile.set shadowJar.archiveFile; dependsOn shadowJar; archiveBaseName = 'aibotassist-neoforge' }
