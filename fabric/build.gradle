plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); fabric() }
configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}
dependencies {
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.115.1+1.21.1'
    modImplementation 'dev.architectury:architectury-fabric:13.0.8'
    include 'dev.architectury:architectury-fabric:13.0.8'
    include 'net.fabricmc.fabric-api:fabric-api:0.115.1+1.21.1'
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}
shadowJar { configurations = [project.configurations.shadowCommon]; archiveClassifier = 'dev-shadow' }
remapJar { inputFile.set shadowJar.archiveFile; dependsOn shadowJar; archiveBaseName = 'aibotassist-fabric' }
