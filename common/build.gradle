architectury { common('fabric', 'neoforge') }
dependencies {
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modApi 'dev.architectury:architectury:13.0.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Build-time only: players receive standalone executables embedded as resources.
def piRoot = rootProject.file('agent-runtime')
def bunCandidates = [
        new File(System.getenv('APPDATA') ?: '', 'npm/node_modules/bun/bin/bun.exe'),
        new File(System.getenv('ProgramFiles') ?: '', 'nodejs/node_modules/bun/bin/bun.exe'),
        new File(System.getenv('BUN_INSTALL') ?: '', 'bin/bun.exe')
]
def detectedBun = bunCandidates.find { it.isFile() }?.absolutePath
def bunBinary = providers.gradleProperty('bunExecutable').getOrElse(detectedBun ?: 'bun')
tasks.register('prepareBundledPi', Exec) {
    workingDir piRoot
    commandLine bunBinary, 'install', '--frozen-lockfile'
    inputs.files(rootProject.file('agent-runtime/package.json'), rootProject.file('agent-runtime/bun.lock'))
    outputs.dir(rootProject.file('agent-runtime/node_modules'))
}
tasks.register('compileBundledPi', Exec) {
    dependsOn 'prepareBundledPi'
    workingDir piRoot
    commandLine bunBinary, 'build.mjs'
    inputs.files(fileTree(piRoot) { include '*.mjs'; exclude '*.test.mjs' }, rootProject.file('agent-runtime/bun.lock'))
    outputs.dir(layout.buildDirectory.dir('generated/pi'))
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/pi'))
tasks.named('processResources') { dependsOn 'compileBundledPi' }
tasks.named('sourcesJar') { dependsOn 'compileBundledPi'; exclude 'aibotassist/pi/**' }
